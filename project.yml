name: Looper
options:
  bundleIdPrefix: com.naokitomita
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Looper:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Looper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naokitomita.looper
        INFOPLIST_FILE: Looper/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
